name: Bug report
description: Report a reproducible problem with the runner or viewer.
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials, private paths, task text, and source excerpts from examples. Do not attach full run captures. Report vulnerabilities through the Security tab's private reporting form.
  - type: input
    id: versions
    attributes:
      label: Versions and operating system
      description: Include Autopilot, Node.js, Codex CLI, and your operating system.
      placeholder: "Autopilot: …; Node.js: …; Codex CLI: …; OS: …"
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Use a minimal, sanitized task or repository example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the exit code or a sanitized error when relevant.
    validations:
      required: true
